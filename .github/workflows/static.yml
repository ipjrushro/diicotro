# Verifică proiectul la fiecare actualizare. Publicarea este făcută exclusiv
# de integrarea GitHub -> Cloudflare Workers.
name: Verify Cloudflare build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Cloudflare Worker
        run: npm run build
